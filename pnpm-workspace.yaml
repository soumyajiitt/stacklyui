packages:
  - "packages/*"
  - "apps/*"

# Allow native/build-time scripts these packages need to compile.
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  msw: false
  "@parcel/watcher": true
  workerd: true

minimumReleaseAgeExclude:
  - miniflare@5.20260926.0-alpha
  - wrangler@4.142.0
